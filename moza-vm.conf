# moza-vm configuration. Installed to /etc/moza-vm.conf.
# After editing the installed copy, re-run install.sh so the udev rule picks up
# any change to MOZA_USB_IDS.

# Name of the libvirt VM.
VM_NAME="moza-win"

# USB devices to hand to the VM. Each entry is either a vendor ID ("346e" =
# every Moza device) or a vendor:product pair.
#
# 0483:df11 is the generic STM32 bootloader (DFU) ID. Some wheelbases may
# reconnect with it partway through a firmware update. If yours shows up with
# a different ID during an update (check with `lsusb`), add it here.
MOZA_USB_IDS="346e 0483:df11"

# VM resources used by create-vm.sh.
VM_MEMORY_MB=4096
VM_VCPUS=2
VM_DISK_GB=40

# Screen size of the Pit House window, baked in by create-vm.sh.
VM_RESOLUTION="1600x900"
